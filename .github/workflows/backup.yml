name: Supabase Daily Backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Dump database
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p backups
          supabase db dump \
            --db-url "postgresql://postgres.pgwxdeynioiqnuvcfltc:${SUPABASE_DB_PASSWORD}@aws-1-eu-central-1.pooler.supabase.com:6543/postgres" \
            -f backups/backup_$(date +'%Y-%m-%d').sql
      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Otomatik yedek: $(date +'%Y-%m-%d')"
          git push

      - name: Delete backups older than 30 days
        run: |
          find backups/ -name "*.sql" -mtime +30 -delete
          git add backups/
          git diff --staged --quiet || (git commit -m "Eski yedekler temizlendi" && git push)